name: Gemini (@gemini-cli)

# Gemini как исполнитель и вторая сторона проверки. Репозиторий публичный:
# запускается только по комментарию владельца, чтобы чужие не тратили ключ.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: gemini
  cancel-in-progress: false

jobs:
  gemini:
    if: |
      contains(github.event.comment.body, '@gemini-cli') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/run-gemini-cli@main
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          prompt: |
            Ты помощник в репозитории. Отвечай по-русски, коротко. Задача из комментария владельца (переменная окружения COMMENT_BODY): выполни её и ответь комментарием в том же issue или PR.
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_pr_number: ${{ github.event.pull_request.number }}
          github_issue_number: ${{ github.event.issue.number }}
